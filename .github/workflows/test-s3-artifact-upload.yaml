name: Test s3-artifact-upload

on:
  pull_request:
    paths:
      - '.github/workflows/test-s3-artifact-upload.yaml'
      - '.github/actions/s3-artifact-upload/**'

permissions:
  contents: read

jobs:
  bats:
    name: Run bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run s3-artifact-upload tests
        run: bats .github/actions/s3-artifact-upload/test/*.bats
