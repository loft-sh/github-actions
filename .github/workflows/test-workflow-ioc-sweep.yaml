name: Test workflow-ioc-sweep

on:
  pull_request:
    paths:
      - '.github/actions/workflow-ioc-sweep/**'
      - '.github/workflows/test-workflow-ioc-sweep.yaml'
      - '.github/workflows/workflow-ioc-sweep.yaml'

permissions:
  contents: read

jobs:
  pytest:
    name: Run workflow-ioc-sweep tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run workflow-ioc-sweep tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/workflow-ioc-sweep/test/ -q
