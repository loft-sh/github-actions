name: Test qa-review-gate

on:
  pull_request:
    paths:
      - '.github/actions/qa-review-gate/**'
      - '.github/workflows/test-qa-review-gate.yaml'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      pr-number:
        description: Leave empty. The sweep starts one run per PR lacking a check and fills this in.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  qa-review-gate:
    name: Test qa-review-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run tests
        run: make test-qa-review-gate

  # Calls the reusable workflow the way a product repo does. The job checks out the
  # action at job.workflow_sha: a ref that resolved to nothing would fall back to main,
  # where the action may not exist yet, and the call would fail. actions: write is the
  # ceiling the sweep job asks for; the gate job lowers itself to read.
  caller:
    name: Smoke-test the reusable workflow from a caller
    permissions:
      checks: write
      pull-requests: write
      contents: read
      actions: write
    uses: ./.github/workflows/qa-review-gate.yaml
    with:
      pr-number: ${{ inputs.pr-number }}

  verify-caller:
    needs: [caller]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the caller result
        env:
          RESULT: ${{ needs.caller.result }}
        run: |
          echo "caller result=$RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::Expected caller result=success, got '$RESULT'"
            exit 1
          fi
