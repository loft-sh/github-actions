name: Test qa-review-gate

on:
  pull_request:
    paths:
      - '.github/actions/qa-review-gate/**'
      - '.github/workflows/test-qa-review-gate.yaml'
      - 'Makefile'
  workflow_dispatch:

permissions: {}

jobs:
  qa-review-gate:
    name: Test qa-review-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run tests
        run: make test-qa-review-gate
