name: Test promote-release

on:
  pull_request:
    paths:
      - '.github/workflows/test-promote-release.yaml'
      - '.github/actions/promote-release/**'

permissions:
  contents: read

jobs:
  bats:
    name: Run bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          tests: .github/actions/promote-release/test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Exercise local composite promote-self wiring
        id: promote
        uses: ./.github/actions/promote-release
        with:
          version: v999.999.999
          images: '[{"image":"ghcr.io/example-org/smoke-test"}]'
          promote-self: 'true'
          github-token: ${{ github.token }}
          docker-username: ${{ github.actor }}
          dry-run: 'true'
      - name: Verify promote-self reached the script
        env:
          PROMOTE_SELF_ENABLED: ${{ steps.promote.outputs.promote-self-enabled }}
        run: test "$PROMOTE_SELF_ENABLED" = true
      # The bats suite calls src/action.sh directly with hand-exported INPUT_*,
      # so it cannot exercise a step-level `if:` in action.yml. That left the
      # dry-run GHCR login unguarded: re-gating it on a real run would put the
      # rehearsal back to reporting every source as missing, with CI green.
      # Asserting the credential landed pins the step actually ran. (Its sibling,
      # the crane install, is covered by accident - reverting that one trips the
      # script's `command -v crane` check and fails this job outright.)
      - name: Verify the rehearsal authenticated to GHCR
        run: |
          config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [[ ! -f "$config" ]]; then
            echo "::error::no docker config at $config; the dry-run GHCR login did not run"
            exit 1
          fi
          if ! jq -e '.auths | has("ghcr.io")' "$config" >/dev/null; then
            echo "::error::docker config has no ghcr.io entry; the dry-run GHCR login did not run"
            jq -r '.auths | keys' "$config"
            exit 1
          fi
          echo "dry-run authenticated to ghcr.io"
