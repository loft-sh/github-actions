name: Test resolve-pr-event
on:
  push:
    branches: [main]
    paths:
      - '.github/actions/resolve-pr-event/**'
      - '.github/workflows/test-resolve-pr-event.yaml'
      - '.github/workflows/backport.yaml'
      - '.github/workflows/claude-code-review.yaml'
      - '.github/workflows/test-claude-code-review.yaml'
      - '.github/workflows/test-backport.yaml'
      - '.github/workflows/claude.yaml'
      - '.github/workflows/claude.yml'
      - '.github/workflows/test-claude.yaml'
  pull_request:
    paths:
      - '.github/actions/resolve-pr-event/**'
      - '.github/workflows/test-resolve-pr-event.yaml'
      - '.github/workflows/backport.yaml'
      - '.github/workflows/claude-code-review.yaml'
      - '.github/workflows/test-claude-code-review.yaml'
      - '.github/workflows/test-backport.yaml'
      - '.github/workflows/claude.yaml'
      - '.github/workflows/claude.yml'
      - '.github/workflows/test-claude.yaml'
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/resolve-pr-event/test/ -q
