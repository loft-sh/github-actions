name: Test link-backport-prs

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/link-backport-prs/**'
      - '.github/workflows/backport.yaml'
      - '.github/workflows/test-link-backport-prs.yaml'
  pull_request:
    paths:
      - '.github/actions/link-backport-prs/**'
      - '.github/workflows/backport.yaml'
      - '.github/workflows/test-link-backport-prs.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .github/actions/link-backport-prs/src/go.mod
      - run: go test ./...
        working-directory: .github/actions/link-backport-prs/src
