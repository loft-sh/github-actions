name: Test release-notes

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/release-notes/**'
      - '.github/actions/release-lib/**.py'
      - '.github/actions/oss-commit-sync/lib.sh'
      - '.github/workflows/test-release-notes.yaml'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/actions/release-notes/**'
      - '.github/actions/release-lib/**.py'
      - '.github/actions/oss-commit-sync/lib.sh'
      - '.github/workflows/test-release-notes.yaml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Run release-notes pytest
        run: make test-release-notes
      - name: Run release-lib pytest
        run: uv run --with pytest==8.3.3 pytest .github/actions/release-lib/test/ -q
