name: Test GHCR tag guard
on:
  pull_request:
    paths:
      - '.github/actions/ghcr-tag-guard/**'
      - '.github/workflows/test-ghcr-tag-guard.yaml'
      - 'Makefile'
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: make test-ghcr-tag-guard
