name: Auto-approve bot PRs

on:
  workflow_call:
    inputs:
      trusted-authors:
        description: 'Comma-separated list of trusted bot logins'
        type: string
        default: 'renovate[bot],loft-bot,github-actions[bot]'
      merge-method:
        description: 'Merge method (squash, merge, rebase)'
        type: string
        default: 'squash'
      auto-merge:
        description: 'Merge the PR after approving it, directly where possible.'
        type: boolean
        default: false
      wait-max-attempts:
        description: 'Max polling attempts waiting for other CI checks (raise this when a slow required check, e.g. e2e, gates the PR).'
        type: string
        default: '90'
      wait-min-attempts:
        description: 'Minimum polls before ci_green=true is allowed.'
        type: string
        default: '12'
      wait-sleep-seconds:
        description: 'Seconds between polling attempts.'
        type: string
        default: '10'
    secrets:
      gh-access-token:
        description: 'GitHub PAT for approving PRs (must be different identity from PR author). Also used for merging when merge-token is omitted.'
        required: true
      merge-token:
        description: 'Optional token used only for merging when auto-merge is true. Defaults to gh-access-token and needs a merge path on the base branch.'
        required: false
      ci-read-token:
        description: 'Optional escape hatch for the read-only CI poll when the caller cannot grant `checks: read` / `statuses: read`. Classic PAT with `repo` scope, or an App token. Never gh-access-token.'
        required: false

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Skip fork PRs — secrets are not available.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # checks/statuses are what the CI poll reads via GITHUB_TOKEN. These lines
    # alone are NOT enough: "the GITHUB_TOKEN permissions passed from the caller
    # workflow can be only downgraded (not elevated) by the called workflow", and
    # anything the caller omits defaults to none. So unless the caller passes the
    # ci-read-token secret, it MUST declare `checks: read` and `statuses: read`
    # itself, or the poll 403s and the action default-denies without ever
    # approving. See DEVOPS-1254.
    permissions:
      pull-requests: write
      contents: read
      checks: read
      statuses: read
    # Safety net — internal steps already guard every failure mode, but if
    # anything unforeseen slips through this still prevents the job from
    # reporting a hard red check on caller CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: loft-sh/github-actions
          ref: main
          persist-credentials: false
          sparse-checkout: .github/actions/auto-approve-bot-prs
      - uses: ./.github/actions/auto-approve-bot-prs
        with:
          trusted-authors: ${{ inputs.trusted-authors }}
          merge-method: ${{ inputs.merge-method }}
          auto-merge: ${{ inputs.auto-merge }}
          wait-max-attempts: ${{ inputs.wait-max-attempts }}
          wait-min-attempts: ${{ inputs.wait-min-attempts }}
          wait-sleep-seconds: ${{ inputs.wait-sleep-seconds }}
          github-token: ${{ secrets.gh-access-token }} # zizmor: ignore[secrets-outside-env] -- PAT passed via workflow_call, not a repo secret
          merge-token: ${{ secrets.merge-token }} # zizmor: ignore[secrets-outside-env] -- optional token passed via workflow_call
          # Empty when the caller does not set it, which falls back to
          # github.token inside the composite.
          ci-read-token: ${{ secrets.ci-read-token }} # zizmor: ignore[secrets-outside-env] -- optional token passed via workflow_call
