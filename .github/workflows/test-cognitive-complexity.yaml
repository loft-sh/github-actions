name: Test cognitive-complexity

on:
  pull_request:
    paths:
      - '.github/actions/cognitive-complexity/**'
      - '.github/workflows/test-cognitive-complexity.yaml'

permissions: {}

jobs:
  bats:
    name: Run bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Same version as the action's default, so the real-binary test covers what callers run.
      - name: Install the pinned gocognit
        run: |
          version=$(yq '.inputs.gocognit-version.default' .github/actions/cognitive-complexity/action.yml)
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/uudashr/gocognit/cmd/gocognit@${version}"
      - name: Run cognitive-complexity tests
        env:
          GOCOGNIT_REAL_BIN: ${{ runner.temp }}/bin/gocognit
        run: bats .github/actions/cognitive-complexity/test/*.bats
