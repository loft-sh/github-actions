name: Test managed-agent-run

on:
  pull_request:
    paths:
      - '.github/actions/managed-agent-run/**'
      - '.github/workflows/test-managed-agent-run.yaml'

permissions:
  contents: read

jobs:
  pytest:
    name: Run managed agent run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run managed agent run tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/managed-agent-run/test/ -q
      - name: Exercise the kill switch through the action manifest
        id: disabled
        uses: ./.github/actions/managed-agent-run
        with:
          anthropic-api-key: dummy-key
          deployment-name: scheduled-routines-cve-remediation
          enabled: false
      - name: Assert the kill switch started nothing
        env:
          SESSION_ID: ${{ steps.disabled.outputs.session-id }}
        run: test -z "$SESSION_ID"
