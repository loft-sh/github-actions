name: Test backport-fix-imports

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/backport-fix-imports/**'
      - '.github/workflows/test-backport-fix-imports.yaml'
  pull_request:
    paths:
      - '.github/actions/backport-fix-imports/**'
      - '.github/workflows/test-backport-fix-imports.yaml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run backport-fix-imports pytest
        run: uv run --with pytest==8.3.3 pytest .github/actions/backport-fix-imports/test/ -q

  # The composite's own contract: when the script cannot start it writes no
  # outputs, and the action must still report conclusion=failed and stay green.
  smoke-no-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shadow python3 with one that cannot start
        run: |
          mkdir -p "$RUNNER_TEMP/broken"
          printf '#!/bin/sh\nexit 127\n' > "$RUNNER_TEMP/broken/python3"
          chmod +x "$RUNNER_TEMP/broken/python3"
          echo "$RUNNER_TEMP/broken" >> "$GITHUB_PATH"
      - name: Run backport-fix-imports
        id: fix
        uses: ./.github/actions/backport-fix-imports
        with:
          target-branch: release-0.0
          backport-branch: backport/release-0.0/pr-0
          github-token: ${{ github.token }}
          push: 'false'
      - name: Verify it reported failed
        env:
          CONCLUSION: ${{ steps.fix.outputs.conclusion }}
          REASON: ${{ steps.fix.outputs.reason }}
        run: |
          echo "conclusion=$CONCLUSION reason=$REASON"
          [ "$CONCLUSION" = failed ]
          [ -n "$REASON" ]
