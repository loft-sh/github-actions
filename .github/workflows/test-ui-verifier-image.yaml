name: Test UI verifier image
on:
  pull_request:
    paths:
      - '.github/actions/ui-verifier-image/**'
      - '.github/workflows/test-ui-verifier-image.yaml'
      - 'Makefile'
permissions:
  contents: read
jobs:
  bats:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run UI verifier image tests
        run: bats .github/actions/ui-verifier-image/test/*.bats
