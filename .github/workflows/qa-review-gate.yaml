name: QA review gate

# Wraps the qa-review-gate composite action for the production repos: picks the
# mode from the event, sparse-checks-out the action, and publishes the qa-review
# and qa-test-run check-runs (both green at once on a trusted bot PR). The caller
# filters the events (the panel's login, the /qa-review command, the bot logins)
# in its job `if:` so most events spin no runner.

on:
  workflow_call:
    inputs:
      override-logins:
        description: 'Comma-separated logins allowed to run /qa-review override (tech leads).'
        type: string
        required: true
      panel-login:
        description: 'Login that posts the panel review.'
        type: string
        default: 'loft-bot'
      bot-prs:
        description: 'Comma-separated login:branch-prefix pairs whose PRs pass both check-runs on the head the bot opened them with.'
        type: string
        default: 'loft-bot:backport/,vcluster-qa-bot[bot]:flake-fixer/'
      qa-team:
        description: 'org/slug of the team asked for a review on /qa-review human.'
        type: string
        default: 'loft-sh/eng-qa'
      check-name:
        description: 'Name of the verdict check-run.'
        type: string
        default: 'qa-review'
      test-check-name:
        description: 'Name of the check-run that says whether the new e2e specs ran and passed.'
        type: string
        default: 'qa-test-run'

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
      actions: read
    steps:
      # job.workflow_sha is the commit the caller's `uses:` tag resolved to, so the
      # action comes from the same revision as this workflow, not from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/qa-review-gate
      - uses: ./.github/actions/qa-review-gate
        with:
          mode: ${{ github.event_name == 'pull_request_review' && 'review' || github.event_name == 'workflow_run' && 'ci' || github.event_name == 'pull_request' && 'bot' || 'comment' }}
          override-logins: ${{ inputs.override-logins }}
          panel-login: ${{ inputs.panel-login }}
          bot-prs: ${{ inputs.bot-prs }}
          qa-team: ${{ inputs.qa-team }}
          check-name: ${{ inputs.check-name }}
          test-check-name: ${{ inputs.test-check-name }}
