name: Notify release

on:
  workflow_call:
    inputs:
      release_version:
        description: 'The release version tag (e.g. v1.2.3)'
        required: true
        type: string
      previous_tag:
        description: 'The previous tag for changelog comparison. Leave empty for a first release; the banner links release notes instead.'
        required: false
        type: string
        default: ''
      target_repo:
        description: 'Target repository (e.g. loft-sh/vcluster)'
        required: true
        type: string
      paired_repo:
        description: 'Second repository publishing the same version (e.g. the public OSS repo alongside a private product repo). When set, the banner links the release and changelog for both repos instead of target_repo only. Leave empty for single-release products.'
        required: false
        type: string
        default: ''
      product:
        description: 'Product name (e.g. vCluster, vCluster Platform)'
        required: true
        type: string
      status:
        description: 'Release status: success, failure, cancelled, or skipped (default: success)'
        required: false
        type: string
        default: 'success'
      ref:
        description: 'The git ref to checkout (defaults to github.ref)'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Validate inputs and workflow structure without sending notifications'
        required: false
        type: boolean
        default: false
      triggered_by:
        description: 'Human who triggered the release; forwarded to the Slack banner. Leave empty to fall back to github.actor (the run actor, which is the bot PAT when the release was dispatched cross-workflow).'
        required: false
        type: string
        default: ''
      is_prerelease:
        description: 'Whether the release was published as a pre-release. Shown as the GitHub label in the banner.'
        required: false
        type: boolean
        default: false
      needs_promotion:
        description: 'Set true when the release is published un-promoted (GitHub "None" label) and a human still has to promote it. Adds a promote reminder with a link to promote_workflow. Opt-in, so products that ship straight to Latest are unaffected.'
        required: false
        type: boolean
        default: false
      promote_workflow:
        description: 'Workflow file in target_repo that performs the promotion, linked from the banner when needs_promotion is true.'
        required: false
        type: string
        default: 'promote-release.yaml'
      slack_channel_id:
        description: 'Channel id of #product-releases. With SLACK_BOT_TOKEN_PRODUCT_RELEASES, the success banner is posted through the bot and its message ts is returned as message_ts, so a later job can reply in its thread.'
        required: false
        type: string
        default: ''
    secrets:
      SLACK_WEBHOOK_URL_PRODUCT_RELEASES:
        description: 'Slack incoming webhook URL for #product-releases. Required for failure notifications, for success banners without a bot token, and by dry-run; the fallback when the bot post did not land.'
        required: false
      SLACK_BOT_TOKEN_PRODUCT_RELEASES:
        description: 'Slack bot token with chat:write and channels:history in slack_channel_id. channels:history lets the action confirm a post that ended without a clear result instead of risking a duplicate.'
        required: false
    outputs:
      message_ts:
        description: 'Message ts of the success banner when the bot token posted it; empty after a webhook post.'
        value: ${{ jobs.notify_release.outputs.message_ts }}
      channel_id:
        description: 'Channel id of the bot token banner post; empty after a webhook post.'
        value: ${{ jobs.notify_release.outputs.channel_id }}

jobs:
  notify_release:
    runs-on: ubuntu-latest
    outputs:
      message_ts: ${{ steps.notify.outputs.message_ts }}
      channel_id: ${{ steps.notify.outputs.channel_id }}
    steps:
      - name: Validate required inputs are non-empty (dry-run)
        if: inputs.dry-run
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PRODUCT: ${{ inputs.product }}
          STATUS: ${{ inputs.status }}
          # v2 required the webhook secret at load time; v3 makes it optional
          # for bot token banners, but failure notices still need it.
          HAS_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_PRODUCT_RELEASES != '' }} # zizmor: ignore[secrets-outside-env] -- presence check only, the value never reaches the step
        run: |
          echo "dry-run: validating notify-release inputs"
          echo "  release_version=$RELEASE_VERSION"
          echo "  previous_tag=$PREVIOUS_TAG"
          echo "  target_repo=$TARGET_REPO"
          echo "  product=$PRODUCT"
          echo "  status=$STATUS"
          REQUIRED_VARS="RELEASE_VERSION TARGET_REPO PRODUCT"
          for var in $REQUIRED_VARS; do
            if [ -z "${!var}" ]; then
              echo "::error::Required input $var is empty"
              exit 1
            fi
          done
          if [ "$HAS_WEBHOOK" != true ]; then
            echo "::error::SLACK_WEBHOOK_URL_PRODUCT_RELEASES is empty. Failure notifications post through it, so a failed release would go unannounced."
            exit 1
          fi
          echo "All required inputs are valid"
      - name: Checkout repository
        if: ${{ !inputs.dry-run && inputs.status == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Notify #product-releases Slack channel
        id: notify
        if: ${{ !inputs.dry-run }}
        uses: loft-sh/github-actions/.github/actions/release-notification@release-notification/v3 # zizmor: ignore[unpinned-uses] -- internal loft-sh/github-actions ref; @v3 is the floating coordination tag that keeps wrapper and composite atomically aligned (see DEVOPS-923 pin-drift class)
        with:
          version: ${{ inputs.release_version }}
          previous_tag: ${{ inputs.previous_tag }}
          changes: "See changelog link below"
          target_repo: ${{ inputs.target_repo }}
          paired_repo: ${{ inputs.paired_repo }}
          product: ${{ inputs.product }}
          status: ${{ inputs.status }}
          is_prerelease: ${{ inputs.is_prerelease }}
          needs_promotion: ${{ inputs.needs_promotion }}
          promote_workflow: ${{ inputs.promote_workflow }}
          # Forward the human actor when the caller supplies one; otherwise fall
          # back to github.actor (the composite's own default) for callers that
          # don't pass it, keeping existing behavior unchanged.
          triggered_by: ${{ inputs.triggered_by || github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_PRODUCT_RELEASES }} # zizmor: ignore[secrets-outside-env] -- webhook URL passed via workflow_call
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN_PRODUCT_RELEASES }} # zizmor: ignore[secrets-outside-env] -- bot token passed via workflow_call
          slack_channel_id: ${{ inputs.slack_channel_id }}
