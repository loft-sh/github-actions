name: Test secret-broker-request

on:
  pull_request:
    paths:
      - '.github/actions/secret-broker-request/**'
      - '.github/workflows/test-secret-broker-request.yaml'

permissions:
  contents: read

jobs:
  pytest:
    name: Run secret broker request tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run secret broker request tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/secret-broker-request/test/ -q
