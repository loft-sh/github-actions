name: Test secret-broker-request

on:
  pull_request:
    paths:
      - '.github/actions/secret-broker-request/**'
      - '.github/workflows/test-secret-broker-request.yaml'

permissions:
  contents: read

jobs:
  pytest:
    name: Run secret broker request tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Run secret broker request tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/secret-broker-request/test/ -q
