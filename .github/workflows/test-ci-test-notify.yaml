name: Test ci-test-notify

on:
  pull_request:
    paths:
      - '.github/actions/ci-test-notify/**'
      - '.github/workflows/test-ci-test-notify.yaml'

permissions: {}

jobs:
  bats:
    name: Run bats tests (${{ matrix.os }})
    # ubuntu-22.04 ships jq 1.6, which callers like the scheduled CVE scans run
    # on. ubuntu-latest has jq 1.7+, which accepts syntax 1.6 rejects.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Run ci-test-notify tests
        run: bats .github/actions/ci-test-notify/test/*.bats
