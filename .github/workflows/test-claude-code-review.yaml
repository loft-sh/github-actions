name: Test claude-code-review

on:
  pull_request:
    paths:
      - '.github/workflows/claude-code-review.yaml'
      - '.github/workflows/test-claude-code-review.yaml'

permissions: {}

jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/claude-code-review.yaml
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  verify:
    needs: [claude-review]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check claude-code-review result
        env:
          RESULT: ${{ needs.claude-review.result }}
        # The workflow reviews same-repo PRs and skips fork PRs. Failure
        # indicates a genuine workflow bug.
        run: |
          echo "claude-code-review result=$RESULT"
          if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
            echo "::error::Expected claude-code-review result=success or skipped, got '$RESULT'"
            exit 1
          fi
          echo "claude-code-review workflow completed with result: $RESULT"
