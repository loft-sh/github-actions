name: Test delete-previous-head-image

on:
  pull_request:
    paths:
      - '.github/actions/delete-previous-head-image/**'
      - '.github/workflows/test-delete-previous-head-image.yaml'

permissions:
  contents: read

jobs:
  pytest:
    name: Run delete-previous-head-image tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run delete-previous-head-image tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/delete-previous-head-image/test/ -q
