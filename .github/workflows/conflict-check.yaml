name: Check for unresolved conflicts

on:
  workflow_call:
    secrets:
      gh-access-token:
        description: 'GitHub PAT for commenting on PRs'
        required: true

concurrency:
  group: conflict-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conflict-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Check for conflict markers
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find conflict markers
        id: conflicts
        uses: loft-sh/github-actions/.github/actions/conflict-check@conflict-check/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh/github-actions ref; reusable workflows check out the CALLER repo, so a local ./.github/actions path is not present here. This workflow and the action move together with the conflict-check/v1 tag.

      # The PAT's own login: sticky-pr-comment only updates a comment with
      # this author and the conflict-check marker, so it never touches another
      # bot's comment the way editing the last comment did.
      - name: Resolve the comment author
        id: author
        if: steps.conflicts.outputs.found == 'true' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.gh-access-token }} # zizmor: ignore[secrets-outside-env] -- PAT passed via workflow_call, not a repo secret
        run: echo "login=$(gh api user --jq .login)" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.conflicts.outputs.found == 'true' && github.event.pull_request.number
        uses: loft-sh/github-actions/.github/actions/sticky-pr-comment@sticky-pr-comment/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh/github-actions ref; reusable workflows check out the CALLER repo, so a local ./.github/actions path is not present here. sticky-pr-comment carries its own independent @sticky-pr-comment/v1 tag.
        with:
          marker: '<!-- conflict-check -->'
          body: ${{ steps.conflicts.outputs.report }}
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.gh-access-token }} # zizmor: ignore[secrets-outside-env] -- PAT passed via workflow_call, not a repo secret
          expected-author: ${{ steps.author.outputs.login }}

      - name: Fail if conflicts found
        if: steps.conflicts.outputs.found == 'true'
        run: |
          echo "::error::Unresolved merge conflict markers found"
          exit 1
