name: Check for unresolved conflicts

on:
  workflow_call:
    secrets:
      gh-access-token:
        description: 'GitHub PAT for commenting on PRs'
        required: true

concurrency:
  group: conflict-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conflict-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Check for conflict markers
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find conflict markers
        id: conflicts
        uses: loft-sh/github-actions/.github/actions/conflict-check@conflict-check/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh/github-actions ref; reusable workflows check out the CALLER repo, so a local ./.github/actions path is not present here. This workflow and the action move together with the conflict-check/v1 tag.

      - name: Comment on PR
        if: steps.conflicts.outputs.found == 'true' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.gh-access-token }} # zizmor: ignore[secrets-outside-env] -- PAT passed via workflow_call, not a repo secret
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_FILE: ${{ steps.conflicts.outputs.report-file }}
        run: |
          # Update existing comment or create new one
          gh pr comment "$PR_NUMBER" --body-file "$REPORT_FILE" --edit-last --create-if-none 2>/dev/null || \
            gh pr comment "$PR_NUMBER" --body-file "$REPORT_FILE"

      - name: Fail if conflicts found
        if: steps.conflicts.outputs.found == 'true'
        run: |
          echo "::error::Unresolved merge conflict markers found"
          exit 1
