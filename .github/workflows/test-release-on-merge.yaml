name: Test release-on-merge
on:
  push:
    branches: [main]
    paths:
      - '.github/actions/release-on-merge/**'
      - '.github/workflows/test-release-on-merge.yaml'
  pull_request:
    paths:
      - '.github/actions/release-on-merge/**'
      - '.github/workflows/test-release-on-merge.yaml'
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run release-on-merge tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/release-on-merge/test -q
