name: Test secret-broker-response

on:
  pull_request:
    paths:
      - '.github/actions/secret-broker-response/**'
      - '.github/workflows/test-secret-broker-response.yaml'

permissions:
  contents: read

jobs:
  pytest:
    name: Run secret broker response tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Run secret broker response tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/secret-broker-response/test/ -q
