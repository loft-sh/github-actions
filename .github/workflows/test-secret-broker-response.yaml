name: Test secret-broker-response

on:
  pull_request:
    paths:
      - '.github/actions/secret-broker-response/**'
      - '.github/workflows/test-secret-broker-response.yaml'

permissions:
  contents: read

jobs:
  pytest:
    name: Run secret broker response tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run secret broker response tests
        run: uv run --with pytest==8.3.3 pytest .github/actions/secret-broker-response/test/ -q
