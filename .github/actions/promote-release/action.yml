name: Promote release
description: |
  Retags the moving docker tags (:latest, :{major}, :{major}.{minor}, and any
  configured suffix variant e.g. -fips, -amd64, -fips-arm64v8) onto the digest
  of an already published, already signed version tag -- a digest-preserving
  `crane tag`, never a rebuild, so cosign signatures (OCI referrers,
  digest-scoped) stay valid with no re-signing. Uses `crane tag` rather than
  `docker buildx imagetools create` because imagetools re-wraps a bare
  single-platform manifest in a new index (changing its digest, orphaning the
  signature); crane preserves the digest for both single-platform manifests
  (per-arch tags) and multi-arch indexes. Optionally also promotes the caller's
  own release (`promote-self`) and the paired public release in a companion
  repo (unsets prerelease, sets latest).

  Wire this from `on: workflow_dispatch` on the repo that owns the moving tags,
  with the version to promote as an input. A `release: types: [released]`
  trigger is NOT suitable for a caller that publishes stable cuts as the GitHub
  "None" label (`release.prerelease: auto`): `released` fires at build time for
  such a cut, which would self-promote it unvetted. It is also resolved from the
  release's own tag ref, so it never fires for tags on maintenance branches that
  predate the workflow file, whereas one `workflow_dispatch` covers every release
  line because the version to promote is an input rather than the ref. That the
  dispatch runs the default branch's copy is a convention, not a guarantee (the
  form has a branch picker and the API accepts any ref), so the caller should
  assert the ref before the secret-bearing job runs.

  Only acts on a stable `vX.Y.Z` version (no prerelease suffix); any other
  shape is a no-op, since moving tags and "latest" promotion aren't meaningful
  for -rc/-alpha/-next cuts.

  Backport-safe: before advancing `:latest`/`:{major}` (or `--latest` on
  oss-repo / the caller's own release), checks whether `version` is newer than
  the release currently flagged Latest on the caller's own repo
  (`GITHUB_REPOSITORY`, set automatically by Actions) / on `oss-repo`
  respectively. The baseline is that Latest pointer, not "newest
  non-prerelease": under `release.prerelease: auto` an un-promoted stable cut is
  already non-prerelease, so only the Latest flag records what `:latest`
  actually tracks. Promoting an older line's patch after a newer stable is
  already `:latest` only advances `:{major}.{minor}` (scoped to that line),
  never `:latest`/`:{major}` backwards. A failure to even list releases fails
  the run closed rather than risking a silent downgrade. Re-promoting the
  current Latest is allowed, so a partially failed promotion can be re-run.
  If NO release carries the Latest flag the baseline falls back to the newest
  stable-shaped tag, not to "advance": that flag is cleared whenever a release
  build is re-run, so an absent pointer must not read as a first-ever
  promotion. The line-scoped check keys on tag shape alone and ignores the
  mutable pre-release flag for the same reason.

  Optionally also promotes a Homebrew tap: a metadata patch, not a rebuild.
  A formula's per-platform sha256 values are exactly what's already in
  oss-repo's `version` release `checksums.txt` (already published, already
  cosign-signed), so nothing is re-hashed - only the version line and each
  url/sha256 pair are rewritten in place, with everything else in the
  formula preserved byte-for-byte. Skipped entirely (not partially) on a
  backport/patch promotion - a formula has no line-scoped equivalent to
  `:{major}.{minor}`.
inputs:
  version:
    description: 'The promoted release tag, e.g. v0.37.1.'
    required: true
  images:
    description: |
      JSON array of image entries to retag, each
      `{"image": "ghcr.io/loft-sh/x", "suffix": ""}` (suffix optional, default
      ""). For each entry, copies `<image>:<version><suffix>` to
      `<image>:latest<suffix>`, `<image>:<major><suffix>`, and
      `<image>:<major>.<minor><suffix>`. The suffix is also how per-arch
      moving tags are promoted: an entry with suffix `-amd64` retags
      `<image>:<version>-amd64` (a bare single-platform manifest) to
      `<image>:latest-amd64` etc. crane preserves its digest, so its cosign
      signature stays valid.
    required: true
  promote-self:
    description: 'Set to "true" to also promote the CALLER repo''s own <version> release (unset pre-release, set Latest). Required when the caller publishes stable cuts with the GitHub "None" label, since nothing else ever flips them. Latest is gated by the same backport check as :latest. On an advancing promotion this edit runs BEFORE the docker retags and any failure to complete it is fatal, because that pointer is this action''s own backport baseline: retagging first would leave it behind :latest and let a later promotion move :latest backwards. Re-run the action to recover. On a backport the edit moves no pointer, so a failure stays a warning.'
    required: false
    default: 'false'
  oss-repo:
    description: 'owner/repo whose matching <version> release should also be promoted (prerelease unset, latest set). Leave empty to skip.'
    required: false
    default: ''
  github-token:
    description: 'Token with GHCR write:packages; contents:write on the caller repo when promote-self is true; and contents:write on oss-repo and homebrew-tap-repo if set.'
    required: true
  docker-username:
    description: 'Username paired with github-token for the GHCR login (GHCR checks the token, but docker/login-action requires a username value).'
    required: true
  homebrew-tap-repo:
    description: 'owner/repo of a Homebrew tap to promote (e.g. loft-sh/homebrew-tap). Requires oss-repo to be set, since checksums come from its release. Leave empty to skip.'
    required: false
    default: ''
  homebrew-formula-paths:
    description: 'JSON array of formula file paths within homebrew-tap-repo to update, e.g. ["Formula/vcluster.rb"]. Required if homebrew-tap-repo is set.'
    required: false
    default: '[]'
  dry-run:
    description: 'Fail-closed: a real promotion runs only on an exact "false" (the default, so a plain dispatch still promotes for real). Any other value ("true", a typo, etc.) is a dry-run that only prints the planned retags/promotion.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Log in to GHCR
      if: inputs.dry-run != 'true'
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ghcr.io
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.github-token }}
    - name: Install crane
      if: inputs.dry-run != 'true'
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      with:
        version: v0.20.2
    - name: Promote release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_PROMOTE_SELF: ${{ inputs.promote-self }}
        INPUT_OSS_REPO: ${{ inputs.oss-repo }}
        INPUT_HOMEBREW_TAP_REPO: ${{ inputs.homebrew-tap-repo }}
        INPUT_HOMEBREW_FORMULA_PATHS: ${{ inputs.homebrew-formula-paths }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: ${{ github.action_path }}/src/action.sh
branding:
  icon: 'upload-cloud'
  color: 'orange'
