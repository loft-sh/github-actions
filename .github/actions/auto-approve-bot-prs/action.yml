name: Auto-approve bot PRs
description: |
  Approves PRs from trusted bot authors whose title/branch matches a known
  safe pattern, after all other CI checks pass. Approval-only failures degrade to
  annotated skips. When auto-merge is requested, an invalid merge request or
  exhaustion of every merge path exits non-zero. The opt-in ruleset-bypass path
  also fails unless the approval was recorded.
inputs:
  trusted-authors:
    description: 'Comma-separated list of trusted bot logins'
    required: false
    default: 'renovate[bot],loft-bot,github-actions[bot]'
  merge-method:
    description: 'Merge method (squash|merge|rebase)'
    required: false
    default: 'squash'
  auto-merge:
    description: 'Merge the PR after approving it, directly where possible. See README "Merging".'
    required: false
    default: 'false'
  merge-when-blocked:
    description: 'Allow the merge token''s configured ruleset bypass to be evaluated by retrying a refused merge through the API. Generic opt-in: callers must restrict eligible authors, branches and PRs. Also requires a recorded approval. See README "Merging".'
    required: false
    default: 'false'
  github-token:
    description: 'PAT used to read PR state and approve. Must NOT match the PR author. Also used to merge when merge-token is omitted.'
    required: true
  merge-token:
    description: 'Optional token used only to merge when auto-merge is true. Defaults to github-token. It may match the PR author, but needs a merge path on the base branch — and with merge-when-blocked, that path is its ruleset bypass.'
    required: false
  ci-read-token:
    description: 'Token for the read-only CI poll only; defaults to the caller GITHUB_TOKEN, which needs `checks: read` and `statuses: read`. Never the approving PAT. See README "Tokens by purpose".'
    required: false
  wait-max-attempts:
    description: 'Max polling attempts waiting for other CI checks'
    required: false
    default: '90'
  wait-min-attempts:
    description: 'Minimum polls before ci_green=true is allowed. Prevents early approval while slow external checks (e.g. Netlify) have not yet registered.'
    required: false
    default: '12'
  wait-sleep-seconds:
    description: 'Seconds between polling attempts'
    required: false
    default: '10'

runs:
  using: composite
  steps:
    - name: Check eligibility
      id: check
      shell: bash
      env:
        TRUSTED_AUTHORS: ${{ inputs.trusted-authors }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      run: ${{ github.action_path }}/src/check-eligibility.sh

    - name: Check PR ready (mergeable + approver identity)
      if: steps.check.outputs.eligible == 'true'
      id: ready
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: ${{ github.action_path }}/src/check-pr-ready.sh

    - name: Wait for other CI to pass
      if: steps.ready.outputs.proceed == 'true'
      id: ci
      shell: bash
      env:
        # Deliberately NOT inputs.github-token. See ci-read-token above.
        # The fallback lives here rather than in an input `default:` because a
        # default only applies when the input is OMITTED. Our own reusable
        # workflow always passes the value through from an optional secret, so it
        # arrives as an explicit empty string when the caller sets nothing, and a
        # `default:` would not fire. `||` treats empty as falsy and does.
        GH_TOKEN: ${{ inputs.ci-read-token || github.token }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SELF_RUN_ID: ${{ github.run_id }}
        WAIT_MAX_ATTEMPTS: ${{ inputs.wait-max-attempts }}
        WAIT_MIN_ATTEMPTS: ${{ inputs.wait-min-attempts }}
        WAIT_SLEEP_SECONDS: ${{ inputs.wait-sleep-seconds }}
      run: ${{ github.action_path }}/src/wait-for-ci.sh

    - name: Re-check PR ready after CI
      if: steps.ci.outputs.ci_green == 'true'
      id: recheck
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: ${{ github.action_path }}/src/check-pr-after-ci.sh

    - name: Approve PR
      id: approve
      if: steps.recheck.outputs.proceed == 'true'
      continue-on-error: true
      uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
      with:
        github-token: ${{ inputs.github-token }}
        review-message: |
          Approved by the shared auto-approve workflow because this PR matched the approval criteria.

          For more information, see https://github.com/loft-sh/github-actions?tab=readme-ov-file#auto-approve-bot-prs.

    # Existing callers keep best-effort approval semantics; the opt-in bypass
    # path requires a recorded approval. The script enforces that rather than
    # this `if`, so a refusal is annotated instead of silently skipped.
    # `outcome`, not `conclusion`: continue-on-error rewrites the latter.
    - name: Merge PR
      if: steps.recheck.outputs.proceed == 'true' && inputs.auto-merge == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.merge-token || inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        MERGE_WHEN_BLOCKED: ${{ inputs.merge-when-blocked }}
        APPROVAL_OUTCOME: ${{ steps.approve.outcome }}
      run: ${{ github.action_path }}/src/enable-auto-merge.sh
