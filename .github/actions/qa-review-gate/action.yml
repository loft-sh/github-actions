name: QA review gate
description: |
  Turns the review panel's QA verdict into the `qa-review` check-run on the pull
  request's head commit, opens the `qa-test-run` check-run next to it, and lets an
  override login or a repository member steer both with one comment. The panel
  (loft-sh/ai-agents pr-review) ends its review body with a marker line; this action
  reads the marker and never talks to the panel itself.
  `review` mode handles a submitted pull request review (verdict check-run, `needs_human`
  hands the PR back to its author, `qa-test-run` opens green or waiting); `comment` mode
  handles `/qa-review override [<reason>]` (override teams and logins only) and `/qa-review human`
  (members); `ci` mode runs when the e2e workflow finishes and checks every spec the PR
  adds against the run's Ginkgo report, completing `qa-test-run`. `bot` mode runs on
  `pull_request` events and completes both check-runs as success on a head a trusted
  bot pushed to its own PR (an automated backport, a flake-fixer PR) and on any PR
  that touches no QA-owned path (the panel never runs there); a trusted bot PR whose
  exemption was declined goes to review whatever it touches. `sweep` mode
  (workflow_dispatch) gives every open PR whose head has no check yet the same QA-scope
  pass, for the PRs already open when the ruleset goes live.
author: "vCluster Labs"
branding:
  icon: "shield"
  color: "orange"

inputs:
  mode:
    description: '"review" (pull_request_review event), "comment" (issue_comment event), "ci" (workflow_run event of the e2e workflow), "bot" (pull_request event: trusted bot PRs and the QA-scope check) or "sweep" (workflow_dispatch: the QA-scope check for every open PR without a check).'
    required: true
  panel-login:
    description: 'Login that posts the panel review. Reviews by anyone else are ignored.'
    required: false
    default: 'loft-bot'
  override-logins:
    description: 'Comma-separated logins allowed to run /qa-review override, on top of override-teams.'
    required: false
    default: ''
  override-teams:
    description: 'Comma-separated org/slug teams whose members may run /qa-review override. Membership is read with org-token.'
    required: false
    default: 'loft-sh/eng-tech-leads,loft-sh/eng-staff-engineers,loft-sh/eng-qa'
  org-token:
    description: 'Token with read:org, used only to read override-teams membership. GITHUB_TOKEN cannot; empty disables the teams.'
    required: false
    default: ''
  bot-prs:
    description: 'Comma-separated login:branch-prefix pairs whose PRs pass both check-runs on every head the bot itself pushed.'
    required: false
    default: 'loft-bot:backport/,vcluster-qa-bot[bot]:flake-fixer/'
  qa-paths:
    description: 'Comma-separated glob patterns of the QA-owned paths the review panel runs on. A PR that touches none of them passes both check-runs as out of scope.'
    required: false
    default: 'e2e*/**,staging/github.com/loft-sh/vcluster/e2e/**,.github/workflows/e2e*.yaml'
  qa-team:
    description: 'org/slug of the team asked for a review on /qa-review human. Empty skips the request.'
    required: false
    default: 'loft-sh/eng-qa'
  check-name:
    description: 'Name of the verdict check-run.'
    required: false
    default: 'qa-review'
  test-check-name:
    description: 'Name of the check-run that says whether the new e2e specs ran and passed.'
    required: false
    default: 'qa-test-run'
  report-trees:
    description: 'Comma-separated artifact=path-prefix pairs: which Ginkgo report artifact covers which source tree. One tree by default; vcluster-pro adds oss-ginkgo-report=staging/github.com/loft-sh/vcluster/.'
    required: false
    default: 'ginkgo-report='
  pr-number:
    description: 'sweep mode: grade this one PR under its head queue. Empty: list the open PRs lacking a check and start one run of caller-workflow per PR.'
    required: false
    default: ''
  caller-workflow:
    description: 'sweep mode: the caller workflow to start per PR, as github.workflow_ref (owner/repo/.github/workflows/<file>@<ref>). The calling job needs actions: write.'
    required: false
    default: ''
  github-token:
    description: 'Token for gh. The calling job must grant checks: write and pull-requests: write; ci mode also needs actions: read, sweep mode actions: write.'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Decide and publish the qa-review check-runs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PANEL_LOGIN: ${{ inputs.panel-login }}
        INPUT_OVERRIDE_LOGINS: ${{ inputs.override-logins }}
        INPUT_OVERRIDE_TEAMS: ${{ inputs.override-teams }}
        INPUT_ORG_TOKEN: ${{ inputs.org-token }}
        INPUT_BOT_PRS: ${{ inputs.bot-prs }}
        INPUT_QA_TEAM: ${{ inputs.qa-team }}
        INPUT_QA_PATHS: ${{ inputs.qa-paths }}
        INPUT_CHECK_NAME: ${{ inputs.check-name }}
        INPUT_TEST_CHECK_NAME: ${{ inputs.test-check-name }}
        INPUT_REPORT_TREES: ${{ inputs.report-trees }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_CALLER_WORKFLOW: ${{ inputs.caller-workflow }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 -I "$ACTION_PATH/src/gate.py"
