name: Refresh GitHub MCP credential
description: Renew a repository-scoped GitHub App token in a managed-agent vault without starting a session.
inputs:
  vault-id:
    description: Managed-agent vault ID.
    required: true
  github-app-id:
    description: GitHub App ID.
    required: true
  github-app-installation-id:
    description: GitHub App installation ID.
    required: true
  github-app-private-key:
    description: GitHub App private key.
    required: true
  github-app-repository:
    description: Single repository to scope the token to.
    required: true
runs:
  using: composite
  steps:
    - name: Install Anthropic SDK
      shell: bash
      run: python3 -m pip install --quiet --disable-pip-version-check anthropic
    - name: Refresh credential
      shell: bash
      env:
        INPUT_VAULT_ID: ${{ inputs.vault-id }}
        INPUT_GITHUB_APP_ID: ${{ inputs.github-app-id }}
        INPUT_GITHUB_APP_INSTALLATION_ID: ${{ inputs.github-app-installation-id }}
        INPUT_GITHUB_APP_PRIVATE_KEY: ${{ inputs.github-app-private-key }}
        INPUT_GITHUB_APP_REPOSITORY: ${{ inputs.github-app-repository }}
      run: python3 "$GITHUB_ACTION_PATH/../src/refresh_github.py"
