name: 'Slack Nightly E2E Test Notification'
description: 'Sends a notification to Slack with E2E nightly test results'
branding:
  icon: "bell"
  color: "orange"
inputs:
  test_results:
    description: 'Test results summary'
    required: true
  run_id:
    description: 'GitHub Actions run ID'
    required: true
  run_number:
    description: 'GitHub Actions run number'
    required: true
  status:
    description: 'Test status (success, failure)'
    required: true
  source_repo:
    description: 'Source repository'
    required: true
  failed_tests:
    description: 'List of failed test suites, if any'
    required: true
    default: ''
  webhook_url:
    description: 'Slack Webhook URL'
    required: true

runs:
  using: "composite"
  steps:
    # Built with jq rather than an inline YAML payload: test_results and
    # failed_tests are usually multi-line, and slack-github-action v4 rejects
    # unindented continuation lines.
    - name: Build Slack payload
      shell: bash
      env:
        STATUS: ${{ inputs.status }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        RUN_ID: ${{ inputs.run_id }}
        RUN_NUMBER: ${{ inputs.run_number }}
        TEST_RESULTS: ${{ inputs.test_results }}
        FAILED_TESTS: ${{ inputs.failed_tests }}
        PAYLOAD_FILE: ${{ runner.temp }}/ci-notify-nightly-tests-payload.json
      run: |
        title="Nightly E2E Tests: ❌ Failure"
        if [[ "$STATUS" == "success" ]]; then
          title="Nightly E2E Tests: ✅ Success"
        fi
        jq -n \
          --arg title "$title" \
          --arg repo "$SOURCE_REPO" \
          --arg run_id "$RUN_ID" \
          --arg run_number "$RUN_NUMBER" \
          --arg results "$TEST_RESULTS" \
          --arg failed "$FAILED_TESTS" \
          '{
            text: $title,
            blocks: [
              { type: "header", text: { type: "plain_text", text: $title, emoji: false } },
              { type: "section", fields: [
                { type: "mrkdwn", text: "*Repository:*\n\($repo)" },
                { type: "mrkdwn", text: "*Run:*\n#\($run_number)" }
              ] },
              { type: "section", text: { type: "mrkdwn", text: "*Test Results:*\n\($results)" } },
              { type: "section", text: { type: "mrkdwn", text: "*Failed tests:*\n\($failed)" } },
              { type: "context", elements: [
                { type: "mrkdwn", text: "<https://github.com/\($repo)/actions/runs/\($run_id)|View Run Details>" }
              ] }
            ]
          }' > "$PAYLOAD_FILE"

    - name: Post E2E test results notification
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
      with:
        errors: true
        webhook-type: incoming-webhook
        webhook: ${{ inputs.webhook_url }}
        payload-file-path: ${{ runner.temp }}/ci-notify-nightly-tests-payload.json
