name: Backport fix imports
description: |
  Repair Go module paths on a backport branch whose target release line is on
  an older module major than its source (for example a v5 main backported to a
  v4 release branch). Rewrites the import paths of modules the repository owns,
  moves files added under a source-only staging directory, resolves conflict
  hunks made only of import lines, then commits and pushes one commit. With an
  Anthropic key, Go conflicts that remain go to an AI pass whose answers are
  committed only for packages that pass go vet. Anything else is left for
  review. Advisory: every failure path warns and exits 0, so it never fails the
  backport that calls it.
inputs:
  target-branch:
    description: 'Release branch the backport PR targets, e.g. release-4.12. Its root go.mod gives the target module paths.'
    required: true
  backport-branch:
    description: 'Head branch of the backport PR, e.g. backport/release-4.12/pr-8606. Checked out, fixed and pushed back.'
    required: true
  source-branch:
    description: 'Branch the original change merged into. Its root go.mod gives the source module paths.'
    required: false
    default: 'main'
  github-token:
    description: 'Token with contents write on the repository, used to fetch and push the backport branch. Supplied to git through the environment, never argv or .git/config.'
    required: true
  push:
    description: 'false commits the fix locally without pushing (dry run).'
    required: false
    default: 'true'
  anthropic-api-key:
    description: 'Anthropic API key. Set, it turns on the AI pass for Go conflicts left after the fix; empty, the AI pass never runs. Needs go and gofmt on the runner.'
    required: false
    default: ''

outputs:
  conclusion:
    description: 'fixed (a commit was made), unchanged (nothing to rewrite), skipped (same module paths, no go.mod, or missing input) or failed.'
    value: ${{ steps.fix.outputs.conclusion || 'failed' }}
  reason:
    description: 'One-line explanation of the conclusion.'
    value: ${{ steps.fix.outputs.reason || 'the fix step did not run; see its log' }}

runs:
  using: composite
  steps:
    # The script exits 0 on every path it controls; continue-on-error covers
    # the rest (a missing interpreter), so a backport is never failed by it.
    # When the script never ran it wrote no outputs, so conclusion and reason
    # fall back to failed above.
    - name: Fix module paths
      id: fix
      continue-on-error: true
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.target-branch }}
        BACKPORT_BRANCH: ${{ inputs.backport-branch }}
        SOURCE_BRANCH: ${{ inputs.source-branch }}
        PUSH: ${{ inputs.push }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: python3 "${{ github.action_path }}/src/fix.py"

    - name: Collect Go conflicts for the AI pass
      id: prepare
      if: inputs.anthropic-api-key != '' && (steps.fix.outputs.conclusion == 'fixed' || steps.fix.outputs.conclusion == 'unchanged')
      continue-on-error: true
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.target-branch }}
      run: python3 "${{ github.action_path }}/src/ai.py" prepare

    - name: Resolve Go conflicts
      id: ai
      if: steps.prepare.outputs.input-file != ''
      continue-on-error: true
      # Pinned by SHA like every internal composite (docs/CONVENTIONS.md).
      uses: loft-sh/github-actions/.github/actions/ai-step@17f1806257f071e23c72c5fae7cfa7af78ab5bae # ai-step/v1
      with:
        provider: anthropic
        # Few calls (only backports with Go conflicts left), and a wrong answer
        # costs a reviewer more than a stronger model costs us.
        effort: high
        max-tokens: '16000'
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        input-file: ${{ steps.prepare.outputs.input-file }}
        prompt: |
          A change merged on ${{ inputs.source-branch }} was cherry-picked onto the older release branch ${{ inputs.target-branch }}, and some Go files have git conflicts.
          The JSON below lists each conflicted file in full. In every conflict block, the part between "<<<<<<< HEAD" and "=======" is the release branch; the part between "=======" and ">>>>>>>" is the backported change. A "|||||||" section, when present, is the common ancestor. The id of a block is the file path, "#", and its 0-based position in that file.

          For every block, return its id and either:
          - resolvable true and code: the final lines that take the place of the whole block, from its "<<<<<<<" line through its ">>>>>>>" line, with the file's indentation; or
          - resolvable false, when you are not sure.

          Rules:
          - Keep what the backported change does, adapted to the release branch. Use only packages, types, functions and fields that the release-branch side of the file shows exist. Import paths of this repository use release_module, never a newer major version.
          - If the change depends on code the release branch does not have, or you are not certain the result compiles and behaves as intended, return resolvable false and say why in reason. A wrong answer is worse than none: a person reviews what you leave.
          - code is the resolved source only: it never contains a "<<<<<<<", "|||||||", "=======" or ">>>>>>>" line.
          - reason is one short sentence.
        output-schema: |
          {
            "type": "object",
            "required": ["resolutions"],
            "properties": {
              "resolutions": {"type": "array", "items": {"type": "object", "required": ["id", "resolvable", "code", "reason"], "properties": {"id": {"type": "string"}, "resolvable": {"type": "boolean"}, "code": {"type": "string"}, "reason": {"type": "string"}}}}
            }
          }

    - name: Apply AI resolutions that pass go vet
      if: steps.ai.outputs.conclusion == 'success'
      continue-on-error: true
      shell: bash
      env:
        TARGET_BRANCH: ${{ inputs.target-branch }}
        BACKPORT_BRANCH: ${{ inputs.backport-branch }}
        PUSH: ${{ inputs.push }}
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_FILE: ${{ steps.prepare.outputs.input-file }}
        AI_RESULT: ${{ steps.ai.outputs.result }}
      run: python3 "${{ github.action_path }}/src/ai.py" apply

    - name: Write the backport PR comment
      id: report
      if: steps.fix.outputs.conclusion == 'fixed' || steps.fix.outputs.conclusion == 'unchanged'
      continue-on-error: true
      shell: bash
      env:
        BACKPORT_BRANCH: ${{ inputs.backport-branch }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: python3 "${{ github.action_path }}/src/report.py"

    - name: Comment on the backport PR
      if: steps.report.outputs.body != ''
      continue-on-error: true
      # Pinned by SHA like every internal composite (docs/CONVENTIONS.md).
      uses: loft-sh/github-actions/.github/actions/sticky-pr-comment@d462e847d4f8f4a139890264a35b68cc30472547 # sticky-pr-comment/v1
      with:
        marker: '<!-- backport-fix-imports -->'
        body: ${{ steps.report.outputs.body }}
        pr-number: ${{ steps.report.outputs.pr-number }}
        github-token: ${{ inputs.github-token }}
        expected-author: ${{ steps.report.outputs.author }}
