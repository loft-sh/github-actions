name: 'oss-commit-sync'
description: "Bidirectional per-commit sync between a monorepo subtree and a downstream OSS repo. Replays each commit's diff (3-way, re-rooted) preserving author, date, and message; links histories with Monorepo-Commit / Oss-Commit trailers; append-only, never force-pushes."

inputs:
  direction:
    description: "export (monorepo subtree -> OSS branch), import (external OSS commits -> PR branch under the subtree), or health (read-only report on anchor staleness and squash-orphaned trailers)."
    required: true
  subtree-prefix:
    description: "Path of the subtree within this repo, e.g. staging/github.com/loft-sh/vcluster. Requires a full-history checkout (fetch-depth: 0)."
    required: true
  oss-repo:
    description: "Downstream OSS repository as owner/repo, e.g. loft-sh/vcluster."
    required: true
  branch:
    description: "Branch to sync (same name on both repos, usually github.ref_name)."
    required: true
  github-token:
    description: "Token used to build the OSS remote URL; never logged. Export needs write access to the OSS repo; import and health only read, so give health the least-privileged token that can fetch the OSS branch (github.token suffices for a public OSS repo) rather than a write-capable PAT."
    required: true
  oss-default-branch:
    description: "OSS default branch used to anchor newly created release-line branches. Export only."
    required: false
    default: main
  seed-monorepo-commit:
    description: "Monorepo commit to resume from when the OSS branch has no Monorepo-Commit trailer yet (first export run). Must be paired with seed-oss-commit."
    required: false
    default: ""
  seed-oss-commit:
    description: "OSS commit anchor for the first run: paired with seed-monorepo-commit on export. On import it is a floor on the resume point; the health direction applies the same floor so both agree. Rarely needed, since the import heals a damaged anchor from subtree content: only when there is no readable Oss-Commit trailer AND no subtree content matching any OSS commit."
    required: false
    default: ""
  align-tree:
    description: "Export only: when the post-replay OSS tree differs from the staging tree, append one snapshot alignment commit instead of failing. Append-only escape hatch; use for migration or after manual reconciliation."
    required: false
    default: "false"
  exclude-paths:
    description: "Newline-separated paths (relative to the OSS repo root) that are never mirrored, e.g. producer workflows. Import drops them from replayed diffs; export ignores them in the divergence guard and the convergence assertion. Pass the same list to both directions."
    required: false
    default: ""
  pr-branch:
    description: "Import only: local branch the replayed commits are created on. Defaults to automation/sync-from-oss-<branch>."
    required: false
    default: ""

outputs:
  pushed:
    description: "Export: true when commits were pushed to the OSS branch."
    value: ${{ steps.sync.outputs.pushed }}
  diverged:
    description: "Export: true when OSS has external commits not yet absorbed and the run failed closed. The documented reaction is to dispatch the import direction."
    value: ${{ steps.sync.outputs.diverged }}
  loose-absorption:
    description: "Export: true when an external counts as absorbed only via an Oss-Commit line outside the block git's own trailer parser reads AND its content is not in the subtree, i.e. the one combination align-tree refuses to overwrite. An ordinary export still proceeds. A run with align-tree true fails only when there is an alignment to make: the refusal guards the overwrite, so if the trees already agree there is nothing to overwrite and the run succeeds with this still true. Do NOT dispatch the import direction on this alone, it has nothing to replay. When diverged is also true, diverged wins: dispatch the import for the unabsorbed commits. Use the health direction to find squash-orphaned trailers generally."
    value: ${{ steps.sync.outputs.loose-absorption }}
  push-rejected:
    description: "Export: true when the push to the OSS branch was rejected by branch protection / a ruleset (the sync identity is not a bypass actor)."
    value: ${{ steps.sync.outputs.push-rejected }}
  exported-count:
    description: "Export: number of commits created on the OSS branch (including an alignment commit, if any)."
    value: ${{ steps.sync.outputs.exported-count }}
  oss-tip:
    description: "Export: the OSS branch tip after the run."
    value: ${{ steps.sync.outputs.oss-tip }}
  has-changes:
    description: "Import: true when at least one external commit was replayed onto the PR branch."
    value: ${{ steps.sync.outputs.has-changes }}
  replayed-count:
    description: "Import: number of external commits replayed."
    value: ${{ steps.sync.outputs.replayed-count }}
  skipped-count:
    description: "Import: number of external commits considered but not replayed, because they touch only excluded paths or their content is already in the subtree."
    value: ${{ steps.sync.outputs.skipped-count }}
  healed-count:
    description: "Import: number of OSS commits the anchor advanced over because the subtree already held their content. Mostly our own exports; see healed-unrecorded-count for the part that indicates a problem."
    value: ${{ steps.sync.outputs.healed-count }}
  healed-export-count:
    description: "Import: of healed-count, the commits we created ourselves (Monorepo-Commit trailer). They never carry an Oss-Commit trailer, so the anchor trails every export until the next import records one past them. Expected, not a finding."
    value: ${{ steps.sync.outputs.healed-export-count }}
  healed-unrecorded-count:
    description: "Import: of healed-count, the commits carrying neither trailer, i.e. imports whose provenance record was lost. Non-zero means trailers are being lost during merge."
    value: ${{ steps.sync.outputs.healed-unrecorded-count }}
  conflict-sha:
    description: "Import: the OSS commit that failed the 3-way apply, when the run failed on a conflict."
    value: ${{ steps.sync.outputs.conflict-sha }}
  pr-branch:
    description: "Import: the local branch holding the replayed commits."
    value: ${{ steps.sync.outputs.pr-branch }}
  converged:
    description: "Health: true when the subtree already holds the OSS branch tip content (ignoring exclude-paths)."
    value: ${{ steps.sync.outputs.converged }}
  anchor:
    description: "Health: the OSS commit the import will resume from, after content healing. Empty only when neither a trailer nor the subtree content identifies one."
    value: ${{ steps.sync.outputs.anchor }}
  recorded-anchor:
    description: "Health: the anchor the Oss-Commit trailers actually record, before content healing. Behind `anchor` when trailers have been lost."
    value: ${{ steps.sync.outputs.recorded-anchor }}
  stale-anchor:
    description: "Health: true when external commits sit in the subtree with no trailer recording them. The import heals this itself; it means those commits carry no recorded provenance on the base branch. Our own exports lag the anchor by design and never set this."
    value: ${{ steps.sync.outputs.stale-anchor }}
  suggested-anchor:
    description: "Health: the content-derived anchor, i.e. what the import heals to. Empty unless stale-anchor is true."
    value: ${{ steps.sync.outputs.suggested-anchor }}
  pending-count:
    description: "Health: number of OSS commits genuinely waiting to be imported."
    value: ${{ steps.sync.outputs.pending-count }}
  redundant-count:
    description: "Health: number of OSS commits the anchor is behind, i.e. what content healing advances over on every import."
    value: ${{ steps.sync.outputs.redundant-count }}
  redundant-export-count:
    description: "Health: of redundant-count, the commits we created ourselves (Monorepo-Commit trailer). Expected after every export, never a finding."
    value: ${{ steps.sync.outputs.redundant-export-count }}
  redundant-unrecorded-count:
    description: "Health: of redundant-count, the external commits carrying no readable Oss-Commit trailer. This is what stale-anchor reports on."
    value: ${{ steps.sync.outputs.redundant-unrecorded-count }}
  squashed-trailer-count:
    description: "Health: number of sync commits carrying an Oss-Commit value outside the trailer block git parses, which a squash-merge produces. A reason to look, not proof: a real trailer line quoted in a commit body looks the same. See the README for what it misses."
    value: ${{ steps.sync.outputs.squashed-trailer-count }}
  degraded:
    description: "Health: true when a git or network step failed and some figures in this report are therefore incomplete. The health direction never exits non-zero, so gate on this rather than on the job result."
    value: ${{ steps.sync.outputs.degraded }}

runs:
  using: "composite"
  steps:
    - name: Sync commits
      id: sync
      shell: bash
      env:
        DIRECTION: ${{ inputs.direction }}
        SUBTREE_PREFIX: ${{ inputs.subtree-prefix }}
        OSS_REMOTE: https://x-access-token:${{ inputs.github-token }}@github.com/${{ inputs.oss-repo }}.git
        BRANCH: ${{ inputs.branch }}
        OSS_DEFAULT_BRANCH: ${{ inputs.oss-default-branch }}
        SEED_MONOREPO_COMMIT: ${{ inputs.seed-monorepo-commit }}
        SEED_OSS_COMMIT: ${{ inputs.seed-oss-commit }}
        ALIGN_TREE: ${{ inputs.align-tree }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        PR_BRANCH: ${{ inputs.pr-branch }}
      run: ${{ github.action_path }}/run.sh
