name: 'Pre-Release Setup'
description: 'Shared setup for the loft-enterprise pre-release vCluster + AI Cloud workflow jobs: free disk, checkout, install Go/kubectl/helm/vCluster CLI, AWS Login, and resolve+validate the four version inputs (standalone vCluster base+upgrade, platform base+RC) resolving anything left empty from the published release list. Resolved versions are also verified against the matching release assets so a missing artifact fails fast before downstream provisioning.'

inputs:
  role-session-name:
    description: 'AWS STS role-session-name. Each consumer job passes a distinct value (e.g. prerelease-vcluster-<run-id>, prerelease-aicloud-<run-id>).'
    required: true
  github-token:
    description: 'GitHub token with contents:read on loft-sh/loft-enterprise. Required because the platform release resolvers call the GitHub API for a private repo; unauthenticated calls return 404. Pass the calling job''s github.token from a job whose permissions grant contents:read.'
    required: true
  standalone-vcluster-version:
    description: 'vCluster version to install for standalone (e.g. 0.34.0). Empty resolves to the highest stable release of loft-sh/vcluster below the upgrade target.'
    required: false
    default: ''
  standalone-vcluster-upgrade-version:
    description: 'vCluster version to upgrade standalone to (e.g. 0.35.0-alpha.7). Empty resolves to the most recently published vCluster pre-release whose final release has not shipped, excluding -next builds. Must differ from the resolved base version.'
    required: false
    default: ''
  platform-base-version:
    description: 'Platform version for the initial install (e.g. 4.9.0). Empty resolves to the highest stable release of loft-sh/loft-enterprise below the RC target.'
    required: false
    default: ''
  platform-rc-version:
    description: 'Platform RC version for upgrade (e.g. 4.10.0-alpha.6). Empty resolves to the most recently published platform pre-release whose final release has not shipped, excluding -next builds.'
    required: false
    default: ''

outputs:
  standalone-vcluster-version:
    description: 'Resolved standalone vCluster version (no leading v).'
    value: ${{ steps.resolve.outputs.standalone-vcluster-version }}
  standalone-vcluster-upgrade-version:
    description: 'Resolved standalone vCluster upgrade version (no leading v).'
    value: ${{ steps.resolve.outputs.standalone-vcluster-upgrade-version }}
  platform-base-version:
    description: 'Resolved platform base version (no leading v).'
    value: ${{ steps.resolve.outputs.platform-base-version }}
  platform-rc-version:
    description: 'Resolved platform RC version (no leading v).'
    value: ${{ steps.resolve.outputs.platform-rc-version }}

runs:
  using: 'composite'
  steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: false

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The test code only reads from the working tree (go build, ginkgo
        # discovery). No subsequent push/fetch needs the embedded token, so
        # we drop it from the .git/config to satisfy zizmor[artipacked].
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    - name: Setup kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

    - name: Setup helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

    - name: AWS Login
      uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
      with:
        role-to-assume: arn:aws:iam::084374023943:role/e2e-test-executor
        role-session-name: ${{ inputs.role-session-name }}
        aws-region: us-west-2
        role-duration-seconds: 6300

    - name: Resolve and validate versions
      id: resolve
      shell: bash
      env:
        STANDALONE_VCLUSTER_VERSION_INPUT: ${{ inputs.standalone-vcluster-version }}
        STANDALONE_VCLUSTER_UPGRADE_VERSION_INPUT: ${{ inputs.standalone-vcluster-upgrade-version }}
        PLATFORM_BASE_VERSION_INPUT: ${{ inputs.platform-base-version }}
        PLATFORM_RC_VERSION_INPUT: ${{ inputs.platform-rc-version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/src/resolve-versions.sh

    - name: Verify release assets
      shell: bash
      env:
        STANDALONE_VCLUSTER_VERSION: ${{ steps.resolve.outputs.standalone-vcluster-version }}
        STANDALONE_VCLUSTER_UPGRADE_VERSION: ${{ steps.resolve.outputs.standalone-vcluster-upgrade-version }}
      run: |
        set -euo pipefail
        # install-standalone.sh comes from a separate vcluster-pro workflow, so a vCluster
        # pre-release can lack it; fail before downstream provisioning (e.g. EC2) is attempted.
        check_asset() { curl -sfIL -o /dev/null "$1" || { echo "::error::missing release asset: $1"; exit 1; }; }
        rel="https://github.com/loft-sh/vcluster/releases/download"
        check_asset "${rel}/v${STANDALONE_VCLUSTER_VERSION}/install-standalone.sh"
        check_asset "${rel}/v${STANDALONE_VCLUSTER_UPGRADE_VERSION}/install-standalone.sh"
        check_asset "${rel}/v${STANDALONE_VCLUSTER_UPGRADE_VERSION}/vcluster-linux-amd64"

    - name: Setup vCluster CLI (matches base standalone version)
      shell: bash
      env:
        STANDALONE_VCLUSTER_VERSION: ${{ steps.resolve.outputs.standalone-vcluster-version }}
      run: |
        set -euo pipefail
        # Initial CLI matches the base standalone vCluster — used by the
        # initial `vcluster platform start` in BeforeSuite. The test swaps
        # this binary to the upgrade-target CLI before the platform upgrade
        # spec runs.
        URL="https://github.com/loft-sh/vcluster/releases/download/v${STANDALONE_VCLUSTER_VERSION}/vcluster-linux-amd64"
        sudo curl -fL "${URL}" -o /usr/local/bin/vcluster
        sudo chmod +x /usr/local/bin/vcluster
        vcluster --version

    - name: Verify required CLIs
      shell: bash
      run: |
        set -e
        echo "kubectl: $(command -v kubectl)"
        kubectl version --client
        echo "helm: $(command -v helm)"
        helm version
        echo "vcluster: $(command -v vcluster)"
        vcluster --version

branding:
  icon: 'package'
  color: 'orange'
