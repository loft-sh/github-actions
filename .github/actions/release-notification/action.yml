name: 'Slack Release Notification'
description: 'Sends a notification to Slack when a new release is published'
branding:
  icon: "bell"
  color: "orange"
inputs:
  version:
    description: 'Release version'
    required: true
  previous_tag:
    description: 'Previous release tag for changelog comparison'
    required: false
    default: ''
  changes:
    description: 'Release changes'
    required: false
    default: 'See changelog link below'
  is_draft:
    description: 'Is this a draft release?'
    required: false
    default: 'false'
  is_prerelease:
    description: 'Is this a pre-release?'
    required: false
    default: 'false'
  needs_promotion:
    description: |
      Set to "true" when the release is published un-promoted and a human still
      has to promote it (the GitHub "None" label: not a pre-release, not Latest).
      Adds a line to the banner pointing at the promote workflow, since the
      release build is the only thing that tells the Release Captain a step is
      left. Opt-in, so products whose releases ship straight to Latest are
      unaffected.
    required: false
    default: 'false'
  promote_workflow:
    description: 'Workflow file in target_repo that performs the promotion. Linked from the banner when needs_promotion is "true".'
    required: false
    default: 'promote-release.yaml'
  target_repo:
    description: 'Target repository'
    required: true
  paired_repo:
    description: |
      Second repository that publishes the same version, e.g. the public OSS
      repo alongside a private product repo. When set, the banner links the
      release and the changelog for BOTH repos instead of target_repo only - a
      single link is wrong for a product whose cut produces two releases, and
      the private one is the less useful of the two for most readers. Leave
      empty for products that publish a single release.
    required: false
    default: ''
  product:
    description: 'Product name (vCluster or vCluster Platform)'
    required: true
  base_branch:
    description: 'Source branch from which the release was cut (auto-detected from git history when omitted)'
    required: false
    default: ''
  status:
    description: 'Release status: success, failure, cancelled, or skipped'
    required: false
    default: 'success'
  webhook_url:
    description: 'Slack Webhook URL'
    required: true
  triggered_by:
    description: 'Who triggered the release (shown in the Slack banner). Defaults to github.actor; callers that dispatch the release via a bot PAT should pass the human actor so the banner does not read as the bot.'
    required: false
    default: ${{ github.actor }}

runs:
  using: "composite"
  steps:
    - name: Validate status input
      shell: bash
      env:
        STATUS: ${{ inputs.status }}
      run: |
        case "$STATUS" in
          success|failure|cancelled|skipped) ;;
          *) echo "::error::Invalid status '$STATUS'. Must be one of: success, failure, cancelled, skipped."; exit 1 ;;
        esac
    - name: Detect base branch
      id: detect_branch
      if: inputs.status == 'success' && inputs.base_branch == ''
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        BRANCH=$("${{ github.action_path }}/detect-branch.sh")
        echo "base_branch=$BRANCH" >> "$GITHUB_OUTPUT"
    - name: Post release notification
      if: inputs.status == 'success'
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c  # v3.0.3
      with:
        errors: true
        webhook-type: incoming-webhook
        webhook: ${{ inputs.webhook_url }}
        payload: |
          text: "New ${{ inputs.product }} Release: ${{ inputs.version }}"
          blocks:
            - type: header
              text:
                type: plain_text
                text: "New ${{ inputs.product }} Release"
                emoji: false
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Version:*\n${{ inputs.version }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Repository:*\n${{ inputs.target_repo }}"
                - type: mrkdwn
                  text: "*Released by:*\n${{ inputs.triggered_by }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Source Branch:*\n${{ inputs.base_branch || steps.detect_branch.outputs.base_branch || 'main' }}"
                # Always-present field rather than a conditionally-appended
                # block: Block Kit payloads here are static YAML, and an empty
                # element is invalid, so the state is rendered as text instead.
                - type: mrkdwn
                  # Fallback is the neutral "Release", never "Latest": callers
                  # that pass neither flag (e.g. vCluster Platform) have their
                  # own labelling rules, and claiming Latest for them would be a
                  # guess.
                  text: "*GitHub label:*\n${{ (inputs.needs_promotion == 'true' && format('`None` - not Latest yet. <https://github.com/{0}/actions/workflows/{1}|Promote it> to move Latest, the moving image tags and the Homebrew formula.', inputs.target_repo, inputs.promote_workflow)) || (inputs.is_prerelease == 'true' && 'Pre-release') || 'Release' }}"
            # One cut can publish two releases (e.g. a private product repo plus
            # its public OSS counterpart), so both the changelog and the release
            # link render per repo when paired_repo is set. Labelled with the
            # repo names rather than "View ...", since with two links the useful
            # information is which repo each one points at. Built with format()
            # in a single expression because Block Kit payloads here are static
            # YAML: elements cannot be appended conditionally.
            - type: section
              text:
                type: mrkdwn
                text: "*Changes:*\n${{ inputs.paired_repo != '' && format('<https://github.com/{0}/compare/{1}...{2}|{0}> | <https://github.com/{3}/compare/{1}...{2}|{3}>', inputs.target_repo, inputs.previous_tag, inputs.version, inputs.paired_repo) || format('<https://github.com/{0}/compare/{1}...{2}|View Full Changelog>', inputs.target_repo, inputs.previous_tag, inputs.version) }}"
            - type: context
              elements:
                - type: mrkdwn
                  text: "${{ inputs.paired_repo != '' && format('Releases: <https://github.com/{0}/releases/tag/{2}|{0}> | <https://github.com/{1}/releases/tag/{2}|{1}>', inputs.target_repo, inputs.paired_repo, inputs.version) || format('<https://github.com/{0}/releases/tag/{1}|View Release>', inputs.target_repo, inputs.version) }}"
    - name: Resolve status text
      id: status_text
      if: inputs.status != 'success'
      shell: bash
      env:
        STATUS: ${{ inputs.status }}
      run: |
        # Use literal Unicode emoji, not Slack :shortcode: codes. The failure
        # banner's leading emoji sits in a Block Kit `header`, and a header's
        # plain_text does NOT render :shortcodes: even with `emoji: true` (Slack
        # only renders shortcodes in mrkdwn/section text). A raw Unicode char
        # renders in a header regardless. This is the actual fix for DEVOPS-1126;
        # flipping the header's `emoji` flag (PR #146) never could have worked.
        case "$STATUS" in
          failure)   printf 'emoji=%s\n' '🚨' >> "$GITHUB_OUTPUT"; echo "label=Failed" >> "$GITHUB_OUTPUT" ;;
          cancelled) printf 'emoji=%s\n' '⚠️' >> "$GITHUB_OUTPUT"; echo "label=Cancelled" >> "$GITHUB_OUTPUT" ;;
          skipped)   printf 'emoji=%s\n' '⏩' >> "$GITHUB_OUTPUT"; echo "label=Skipped" >> "$GITHUB_OUTPUT" ;;
        esac
    - name: Post release failure notification
      if: inputs.status != 'success'
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c  # v3.0.3
      with:
        errors: true
        webhook-type: incoming-webhook
        webhook: ${{ inputs.webhook_url }}
        payload: |
          text: "${{ steps.status_text.outputs.emoji }} ${{ inputs.product }} release pipeline ${{ steps.status_text.outputs.label }} for ${{ inputs.version }}"
          blocks:
            - type: header
              text:
                type: plain_text
                text: "${{ steps.status_text.outputs.emoji }} Release Pipeline ${{ steps.status_text.outputs.label }}"
                emoji: true
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Product:*\n${{ inputs.product }}"
                - type: mrkdwn
                  text: "*Version:*\n${{ inputs.version }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Triggered by:*\n${{ inputs.triggered_by }}"
                - type: mrkdwn
                  text: "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View details>"
