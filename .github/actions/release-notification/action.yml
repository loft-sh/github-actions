name: 'Slack Release Notification'
description: 'Sends a notification to Slack when a new release is published'
branding:
  icon: "bell"
  color: "orange"
inputs:
  version:
    description: 'Release version'
    required: true
  previous_tag:
    description: 'Previous release tag for changelog comparison'
    required: false
    default: ''
  changes:
    description: 'Release changes'
    required: false
    default: 'See changelog link below'
  is_draft:
    description: 'Is this a draft release?'
    required: false
    default: 'false'
  is_prerelease:
    description: 'Whether to show the release as a GitHub pre-release in the banner.'
    required: false
    default: 'false'
  needs_promotion:
    description: 'Whether to show a GitHub promotion reminder linking to promote_workflow.'
    required: false
    default: 'false'
  promote_workflow:
    description: 'Workflow file in target_repo that performs the promotion. Linked from the banner when needs_promotion is "true".'
    required: false
    default: 'promote-release.yaml'
  target_repo:
    description: 'Target repository'
    required: true
  paired_repo:
    description: 'Optional second repository whose release and changelog are linked in the banner.'
    required: false
    default: ''
  product:
    description: 'Product name (vCluster or vCluster Platform)'
    required: true
  base_branch:
    description: 'Source branch from which the release was cut (auto-detected from git history when omitted)'
    required: false
    default: ''
  status:
    description: 'Release status: success, failure, cancelled, or skipped'
    required: false
    default: 'success'
  webhook_url:
    description: 'Slack incoming webhook URL. Required for failure notifications, and for success banners unless slack_bot_token and slack_channel_id are set. With a bot token it is the fallback when the bot post did not land.'
    required: false
    default: ''
  slack_bot_token:
    description: 'Slack bot token with chat:write in slack_channel_id, plus channels:history (groups:history for a private channel) to confirm a post that ended without a clear result. When set with slack_channel_id, the success banner is posted through chat.postMessage and its message ts is exposed for thread replies.'
    required: false
    default: ''
  slack_channel_id:
    description: 'Slack channel id for the bot token post.'
    required: false
    default: ''
  dry-run:
    description: 'Resolve and expose banner text without posting to Slack. Intended for validation and smoke tests.'
    required: false
    default: 'false'
  triggered_by:
    description: 'Who triggered the release (shown in the Slack banner). Defaults to github.actor; callers that dispatch the release via a bot PAT should pass the human actor so the banner does not read as the bot.'
    required: false
    default: ${{ github.actor }}

outputs:
  label_field:
    description: 'Resolved optional Block Kit field for the GitHub release label.'
    value: ${{ steps.release_text.outputs.label_field }}
  changelog_text:
    description: 'Resolved changelog or release-notes link text.'
    value: ${{ steps.release_text.outputs.changelog_text }}
  release_text:
    description: 'Resolved release link text.'
    value: ${{ steps.release_text.outputs.release_text }}
  message_ts:
    description: 'Message ts of the success banner when it was posted with the bot token; empty after a webhook post. Thread replies use it as thread_ts.'
    value: ${{ steps.banner.outputs.ts }}
  channel_id:
    description: 'Channel id of the bot token banner post; empty after a webhook post.'
    value: ${{ steps.banner.outputs.channel_id }}

runs:
  using: "composite"
  steps:
    - name: Validate status input
      shell: bash
      env:
        STATUS: ${{ inputs.status }}
      run: |
        case "$STATUS" in
          success|failure|cancelled|skipped) ;;
          *) echo "::error::Invalid status '$STATUS'. Must be one of: success, failure, cancelled, skipped."; exit 1 ;;
        esac
    - name: Validate Slack transport
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        STATUS: ${{ inputs.status }}
        HAS_WEBHOOK: ${{ inputs.webhook_url != '' }}
        HAS_BOT_TOKEN: ${{ inputs.slack_bot_token != '' }}
        HAS_CHANNEL: ${{ inputs.slack_channel_id != '' }}
      run: bash "${{ github.action_path }}/validate-transport.sh"
    - name: Detect base branch
      id: detect_branch
      if: inputs.status == 'success' && inputs.base_branch == ''
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        BRANCH=$("${{ github.action_path }}/detect-branch.sh")
        echo "base_branch=$BRANCH" >> "$GITHUB_OUTPUT"
    - name: Resolve release label and links
      id: release_text
      if: inputs.status == 'success'
      shell: bash
      env:
        TARGET_REPO: ${{ inputs.target_repo }}
        PAIRED_REPO: ${{ inputs.paired_repo }}
        VERSION: ${{ inputs.version }}
        PREVIOUS_TAG: ${{ inputs.previous_tag }}
        IS_PRERELEASE: ${{ inputs.is_prerelease }}
        NEEDS_PROMOTION: ${{ inputs.needs_promotion }}
        PROMOTE_WORKFLOW: ${{ inputs.promote_workflow }}
      run: bash "${{ github.action_path }}/resolve-release-text.sh"
    # The bot post exposes the banner's ts so a later job can reply in its
    # thread. errors: false keeps a rejection out of the run's annotations,
    # and retries are off because a resend after a timeout or a 5xx can
    # duplicate a banner that landed. banner-result.py then decides whether
    # it posted and whether the webhook below posts it instead.
    - name: Post release notification (bot token)
      id: post_bot
      if: inputs.status == 'success' && inputs.dry-run != 'true' && inputs.slack_bot_token != '' && inputs.slack_channel_id != ''
      continue-on-error: true
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
      with:
        errors: false
        retries: '0'
        method: chat.postMessage
        token: ${{ inputs.slack_bot_token }}
        payload: |
          channel: "${{ inputs.slack_channel_id }}"
          text: "New ${{ inputs.product }} Release: ${{ inputs.version }}"
          metadata:
            event_type: release_banner
            event_payload:
              repository: "${{ inputs.target_repo }}"
              version: "${{ inputs.version }}"
          blocks:
            - type: header
              text:
                type: plain_text
                text: "New ${{ inputs.product }} Release"
                emoji: false
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Version:*\n${{ inputs.version }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Repository:*\n${{ inputs.target_repo }}"
                - type: mrkdwn
                  text: "*Released by:*\n${{ inputs.triggered_by }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Source Branch:*\n${{ inputs.base_branch || steps.detect_branch.outputs.base_branch || 'main' }}"
                # Empty when neither state flag is set, which omits the element
                # and preserves the banner shape for existing callers.
                ${{ steps.release_text.outputs.label_field }}
            - type: section
              text:
                type: mrkdwn
                text: ${{ steps.release_text.outputs.changes_json }}
            - type: context
              elements:
                - type: mrkdwn
                  text: ${{ steps.release_text.outputs.release_json }}
    - name: Check bot token banner
      id: banner
      if: inputs.status == 'success' && inputs.dry-run != 'true' && inputs.slack_bot_token != '' && inputs.slack_channel_id != ''
      shell: bash
      env:
        POST_OK: ${{ steps.post_bot.outputs.ok }}
        POST_RESPONSE: ${{ steps.post_bot.outputs.response }}
        POST_TS: ${{ steps.post_bot.outputs.ts }}
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        CHANNEL_ID: ${{ inputs.slack_channel_id }}
        REPOSITORY: ${{ inputs.target_repo }}
        VERSION: ${{ inputs.version }}
        HAS_WEBHOOK: ${{ inputs.webhook_url != '' }}
      run: python3 "${{ github.action_path }}/banner-result.py"
    - name: Post release notification
      if: inputs.status == 'success' && inputs.dry-run != 'true' && steps.banner.outputs.posted != 'true' && inputs.webhook_url != ''
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
      with:
        errors: true
        # No resend when the webhook is the bot post's fallback: a retry
        # after a lost response would post the banner twice. Webhook-only
        # callers keep the action's default.
        retries: ${{ steps.banner.outputs.webhook_retries || '5' }}
        webhook-type: incoming-webhook
        webhook: ${{ inputs.webhook_url }}
        payload: |
          text: "New ${{ inputs.product }} Release: ${{ inputs.version }}"
          blocks:
            - type: header
              text:
                type: plain_text
                text: "New ${{ inputs.product }} Release"
                emoji: false
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Version:*\n${{ inputs.version }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Repository:*\n${{ inputs.target_repo }}"
                - type: mrkdwn
                  text: "*Released by:*\n${{ inputs.triggered_by }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Source Branch:*\n${{ inputs.base_branch || steps.detect_branch.outputs.base_branch || 'main' }}"
                # Empty when neither state flag is set, which omits the element
                # and preserves the banner shape for existing callers.
                ${{ steps.release_text.outputs.label_field }}
            - type: section
              text:
                type: mrkdwn
                text: ${{ steps.release_text.outputs.changes_json }}
            - type: context
              elements:
                - type: mrkdwn
                  text: ${{ steps.release_text.outputs.release_json }}
    - name: Resolve status text
      id: status_text
      if: inputs.status != 'success'
      shell: bash
      env:
        STATUS: ${{ inputs.status }}
      run: |
        # Use literal Unicode emoji, not Slack :shortcode: codes. The failure
        # banner's leading emoji sits in a Block Kit `header`, and a header's
        # plain_text does NOT render :shortcodes: even with `emoji: true` (Slack
        # only renders shortcodes in mrkdwn/section text). A raw Unicode char
        # renders in a header regardless. This is the actual fix for DEVOPS-1126;
        # flipping the header's `emoji` flag (PR #146) never could have worked.
        case "$STATUS" in
          failure)   printf 'emoji=%s\n' '🚨' >> "$GITHUB_OUTPUT"; echo "label=Failed" >> "$GITHUB_OUTPUT" ;;
          cancelled) printf 'emoji=%s\n' '⚠️' >> "$GITHUB_OUTPUT"; echo "label=Cancelled" >> "$GITHUB_OUTPUT" ;;
          skipped)   printf 'emoji=%s\n' '⏩' >> "$GITHUB_OUTPUT"; echo "label=Skipped" >> "$GITHUB_OUTPUT" ;;
        esac
    - name: Post release failure notification
      if: inputs.status != 'success' && inputs.dry-run != 'true'
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
      with:
        errors: true
        webhook-type: incoming-webhook
        webhook: ${{ inputs.webhook_url }}
        payload: |
          text: "${{ steps.status_text.outputs.emoji }} ${{ inputs.product }} release pipeline ${{ steps.status_text.outputs.label }} for ${{ inputs.version }}"
          blocks:
            - type: header
              text:
                type: plain_text
                text: "${{ steps.status_text.outputs.emoji }} Release Pipeline ${{ steps.status_text.outputs.label }}"
                emoji: true
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Product:*\n${{ inputs.product }}"
                - type: mrkdwn
                  text: "*Version:*\n${{ inputs.version }}"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Triggered by:*\n${{ inputs.triggered_by }}"
                - type: mrkdwn
                  text: "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View details>"
