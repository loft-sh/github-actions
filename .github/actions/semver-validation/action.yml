name: "Semantic Version Validation"
description: "Validates a version string against semver, reports its parts and release type, and optionally orders it against a second version."
author: "vCluster Labs"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  version:
    description: "Version string to validate against semver format"
    required: true
  compare_to:
    description: "Second version to order `version` against. Leave empty to skip the comparison."
    required: false
    default: ""
  verify-signature:
    description: |
      Verify the semstat release's `checksums.txt` against its cosign bundle before
      trusting it, proving the release came from semstat's own release workflow at
      that exact tag rather than only that the download arrived intact. Costs a
      cosign install on the job, so it is off by default; turn it on where this
      action's answer gates a publish.
    required: false
    default: "false"

outputs:
  is_valid:
    description: "Whether the version is a valid semver (true/false)"
    value: ${{ steps.report.outputs.is_valid }}
  parsed_version:
    description: "Parsed version object with major, minor, patch, prerelease, and build metadata"
    value: ${{ steps.report.outputs.parsed_version }}
  error_message:
    description: "Error message if validation fails"
    value: ${{ steps.report.outputs.error_message }}
  is_stable:
    description: "Whether the version carries no prerelease suffix (true/false). Empty when the version is invalid."
    value: ${{ steps.report.outputs.is_stable }}
  release_type:
    description: "Release channel: stable, alpha, beta, rc, next or next-internal. Empty when the version is invalid, or valid semver with a suffix outside that vocabulary."
    value: ${{ steps.report.outputs.release_type }}
  major:
    description: "Major version number. Empty when the version is invalid."
    value: ${{ steps.report.outputs.major }}
  minor:
    description: "Minor version number. Empty when the version is invalid."
    value: ${{ steps.report.outputs.minor }}
  patch:
    description: "Patch version number. Empty when the version is invalid."
    value: ${{ steps.report.outputs.patch }}
  prerelease:
    description: "Prerelease identifiers without the leading hyphen. Empty for a stable version and for an invalid one."
    value: ${{ steps.report.outputs.prerelease }}
  build:
    description: "Build metadata without the leading plus. Empty when absent and when the version is invalid."
    value: ${{ steps.report.outputs.build }}
  comparison:
    description: "-1, 0 or 1 as version sorts below, equal to, or above compare_to. Empty unless both are valid."
    value: ${{ steps.report.outputs.comparison }}
  is_greater:
    description: "Whether version sorts strictly above compare_to (true/false). Empty unless both are valid."
    value: ${{ steps.report.outputs.is_greater }}

runs:
  using: "composite"
  steps:
    - name: Install cosign
      if: inputs.verify-signature == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    # setup-semstat's installer, run out of the checkout this action came in
    # rather than through `uses:`. Neither form of `uses:` works for a sibling in
    # the same repository: a relative `uses: ./...` resolves against the caller's
    # workspace and finds nothing once this action is consumed from another repo,
    # and a SHA pin can only name a commit from before the change that needs it,
    # which then keeps running while fixes to the installer land elsewhere. Both
    # actions ship from one commit, so running the script off github.action_path
    # is what makes them impossible to drift apart. Which release is installed,
    # and the Renovate comment tracking it, live with the script.
    - name: Install semstat
      id: install
      shell: bash
      env:
        SEMSTAT_VERIFY_SIGNATURE: ${{ inputs.verify-signature }}
        # Composite steps inherit the job's environment, and the installer reads
        # both of these from it. Cleared here, where step env wins, so a
        # workflow-level env: or an earlier step writing GITHUB_ENV cannot
        # repoint which executable this action runs: the base URL because the
        # archive and the checksums.txt it is verified against come from the same
        # root, so a planted release verifies against its own planted manifest,
        # and the version because this action ships one pinned release rather
        # than whichever one the job asks for.
        SEMSTAT_VERSION: ""
        SEMSTAT_BASE_URL: ""
      run: ${{ github.action_path }}/../setup-semstat/src/install-semstat.sh

    - name: Report on the version
      id: report
      shell: bash
      env:
        SEMSTAT_BIN: ${{ steps.install.outputs.semstat }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMPARE_TO: ${{ inputs.compare_to }}
      run: ${{ github.action_path }}/src/report.sh
