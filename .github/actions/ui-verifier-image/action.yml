name: Publish UI verifier backend image
description: Build and push a private backend dev image for the UI verifier
inputs:
  head-sha:
    description: Full commit SHA of the checked-out PR head
    required: true
outputs:
  image:
    description: Published image reference
    value: ${{ steps.push.outputs.image }}
runs:
  using: composite
  steps:
    - name: Build backend image
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head-sha }}
      run: bash "$GITHUB_ACTION_PATH/src/build.sh"
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: projects/464415226524/locations/global/workloadIdentityPools/github/providers/github-actions
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
    - name: Push backend image
      id: push
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head-sha }}
      run: bash "$GITHUB_ACTION_PATH/src/push.sh"
