name: Push UI verifier backend image
description: Push the locally built backend dev image using caller-configured Docker access
branding:
  icon: package
  color: blue
inputs:
  head-sha:
    description: Full commit SHA used to tag the local image
    required: true
  image-repository:
    description: Private Artifact Registry Docker image path without a tag or digest
    required: true
outputs:
  image:
    description: Published image reference
    value: ${{ steps.push.outputs.image }}
runs:
  using: composite
  steps:
    - name: Push backend image
      id: push
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head-sha }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
      run: bash "$GITHUB_ACTION_PATH/../src/push.sh"
